name: CI/CD Pipeline - Tienda EKS

on:
  push:
    branches:
      - main # Se dispara automáticamente al fusionar código en la rama main

env:
  AWS_REGION: "us-east-1"
  CLUSTER_NAME: "devopseks"
  # GitHub Actions te da el Account ID automáticamente en el contexto, pero usaremos secrets por seguridad

jobs:
  deploy:
    name: Build and Deploy to Amazon EKS
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el código del repositorio
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Configurar credenciales de AWS usando Secrets de GitHub
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}

    # 3. Login oficial en Amazon ECR (Reemplaza tu comando 'aws ecr get-login-password')
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # 4. Configurar herramientas necesarias (kubectl)
    - name: Setup Kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'latest'

    # 5. Actualizar el Kubeconfig para conectar con tu EKS
    - name: Update Kubeconfig
      run: |
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

    # 6. Instalar Metrics Server e inyectar la URL de ECR en los archivos YAML
    - name: Prepare Kubernetes Manifests
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
        find ./k8s -type f -name "*.yaml" -exec sed -i "s|{{ECR_URL}}|${ECR_REGISTRY}|g" {} \;

    # 7. Construir y subir imágenes de Docker (Frontend, Backend, DB)
    - name: Build and Push Docker Images
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        # FRONTEND
        docker build -t $ECR_REGISTRY/tienda-frontend:eks-v1 ./frontend
        docker push $ECR_REGISTRY/tienda-frontend:eks-v1
        
        # BACKEND
        docker build -t $ECR_REGISTRY/tienda-backend:eks-v1 ./backend
        docker push $ECR_REGISTRY/tienda-backend:eks-v1
        
        # DB
        docker build -t $ECR_REGISTRY/tienda-db:eks-v1 ./db
        docker push $ECR_REGISTRY/tienda-db:eks-v1

    # 8. Desplegar Base de Datos y verificar estado
    - name: Deploy MySQL Database
      run: |
        kubectl apply -f ./k8s/namespace.yaml
        kubectl apply -f ./k8s/mysql-secret.yaml
        kubectl apply -f ./k8s/mysql-deployment.yaml
        kubectl apply -f ./k8s/mysql-service.yaml
        kubectl rollout status deployment/tienda-db -n tienda --timeout=300s

    # 9. Desplegar Backend y verificar estado
    - name: Deploy Backend
      run: |
        kubectl apply -f ./k8s/backend-deployment.yaml
        kubectl apply -f ./k8s/backend-service.yaml
        kubectl rollout status deployment/tienda-backend -n tienda --timeout=300s

    # 10. Desplegar Frontend y verificar estado
    - name: Deploy Frontend
      run: |
        kubectl apply -f ./k8s/frontend-deployment.yaml
        kubectl apply -f ./k8s/frontend-service.yaml
        kubectl rollout status deployment/tienda-frontend -n tienda --timeout=300s

    # 11. Obtener la URL del LoadBalancer público
    - name: Get LoadBalancer URL
      run: |
        echo "Esperando LoadBalancer..."
        for i in {1..40}
        do
          HOSTNAME=$(kubectl get svc tienda-frontend -n tienda -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          IP=$(kubectl get svc tienda-frontend -n tienda -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          
          if [ ! -z "$HOSTNAME" ]; then
            echo "===================================="
            echo "APLICACIÓN DISPONIBLE EN: http://${HOSTNAME}"
            echo "===================================="
            exit 0
          fi
          
          if [ ! -z "$IP" ]; then
            echo "===================================="
            echo "APLICACIÓN DISPONIBLE EN: http://${IP}"
            echo "===================================="
            exit 0
          fi
          echo "Esperando IP pública... (${i}/40)"
          sleep 15
        done
        echo "No fue posible obtener la IP pública a tiempo."
        exit 1